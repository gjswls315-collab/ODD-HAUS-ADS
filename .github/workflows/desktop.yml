name: ODD HAUS Desktop

# Tests the desktop app and builds the Windows / macOS zips.
# Every run uploads the zips as workflow artifacts; pushing a tag like `desktop-v1.0.0`
# also publishes them as a GitHub release (the app's "new version" check looks there).

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'desktop/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win zip --x64
          - os: macos-latest
            target: --mac zip --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OddHausDesktop-${{ runner.os }}
          path: desktop/dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ODD HAUS Desktop ${{ github.ref_name }}
          files: zips/*.zip
