<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eclipse Requiem</title>
<style>
  :root { --bg: #07080B; --fg: #D9CDB6; --muted: #838B97; --line: #3A404B; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #07080B; --fg: #D9CDB6; } }
  :root[data-theme="dark"] { --bg: #07080B; --fg: #D9CDB6; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { font-family: system-ui, sans-serif; }
  canvas#game { display: block; position: fixed; inset: 0; outline: none; touch-action: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 600 14px monospace; letter-spacing: 0.3em; color: var(--muted); }
  #nokbd { display: none; position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 12px 16px; border: 1px solid var(--line); background: #0E1015; color: var(--fg); font-size: 14px; line-height: 1.5; text-align: center; }
  @media (hover: none) and (pointer: coarse) { #nokbd { display: block; } }
</style>
</head>
<body>
<div id="boot">ECLIPSE REQUIEM</div>
<canvas id="game" tabindex="0" aria-label="ECLIPSE REQUIEM game screen"></canvas>
<div id="nokbd">이 게임은 PC 키보드(또는 게임패드)로 플레이합니다. Play with a keyboard or gamepad.</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
