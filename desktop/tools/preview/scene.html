<!doctype html>
<meta charset="utf-8" />
<title>desktop scene</title>
<!-- A pretend desktop: the overlay and the desk side by side, each with its own mock bridge.
     Query parameters are passed on to both (pack=, ep=, typing=, remind=, friend=, scale=). -->
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(120% 60% at 30% 105%, #8fcf6a 0 40%, transparent 41%),
      radial-gradient(90% 50% at 85% 110%, #a6dc7c 0 45%, transparent 46%),
      linear-gradient(#5d9ee8, #bcdcff 75%);
  }
  iframe {
    position: absolute;
    border: 0;
    background: transparent;
  }
  #overlay {
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #desk {
    right: 16px;
    bottom: 0;
    width: 300px;
    height: 400px;
  }
</style>
<iframe id="overlay"></iframe>
<iframe id="desk"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  q.set('transparent', '1');
  // borrow=0 keeps the desk friend at the keyboard during episodes
  const desk = q.get('borrow') === '0' ? '' : `&desk=${innerWidth - 316},${innerHeight - 400},300,400`;
  document.getElementById('overlay').src = `../../src/renderer/overlay/index.html?${q}${desk}`;
  document.getElementById('desk').src = `../../src/renderer/desk/index.html?${q}`;
  // like the main process: tell the desk when its friend steps out for an episode
  addEventListener('message', (e) => {
    const desk = document.getElementById('desk').contentWindow;
    if (e.data && e.data.oddEpisode && desk.__mock) desk.__mock.emit('episode', e.data.oddEpisode);
  });
  setTimeout(() => (document.title = 'ready'), 1500);
</script>
