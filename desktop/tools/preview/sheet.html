<!doctype html>
<meta charset="utf-8" />
<title>cast sheet</title>
<style>
  @font-face { font-family: Jua; src: url(../../src/renderer/fonts/Jua.woff2); }
  body { margin: 0; background: #cfe6ff; }
</style>
<canvas id="c"></canvas>
<script type="module">
  import { drawFriend, FRIEND_IDS, drawEmote, drawBubble } from '../../src/renderer/shared/draw.js';
  const q = new URLSearchParams(location.search);
  const poses = (q.get('poses') || 'stand,walk,sit,wave,cheer,eat,sleep,held').split(',');
  const S = Number(q.get('s') || 1.4);
  const c = document.getElementById('c');
  const cw = 130 * S, ch = 140 * S;
  c.width = cw * poses.length; c.height = ch * FRIEND_IDS.length;
  const ctx = c.getContext('2d');
  await document.fonts.load('14px Jua');
  const t = Number(q.get('t') || 1.3);
  FRIEND_IDS.forEach((id, row) => poses.forEach((pose, col) => {
    ctx.save();
    ctx.translate(col * cw + cw / 2, row * ch + ch - 14);
    ctx.scale(S, S);
    const acc = q.get('acc') ? q.get('acc').split(',') : [];
    drawFriend(ctx, id, { pose, phase: t * 6, t0: 0, seed: row, acc, item: q.get('item') || undefined }, t);
    ctx.restore();
  }));
  document.title = 'ready';
</script>
