<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ODD HAUS — Christmas After Hours</title>
  <meta name="description" content="ODD HAUS — Christmas After Hours. A 40-second winter brand film, rendered live in the browser." />
  <link rel="icon" href="data:," />
  <link rel="preload" href="./fonts/Anton.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main class="shell">
    <header class="top">
      <span class="brand">ODD HAUS</span>
      <span class="title">Christmas After Hours — Winter 2026</span>
      <span class="shot" id="shot"></span>
    </header>

    <div class="wrap" id="wrap"><div class="stage" id="stage">
      <canvas id="film" aria-label="ODD HAUS Christmas After Hours brand film"></canvas>
      <div class="veil" id="veil">
        <div class="veil-inner">
          <p class="veil-brand">ODD HAUS</p>
          <p class="veil-title">Christmas After Hours</p>
          <button class="big" id="start" type="button" disabled>Loading…</button>
          <p class="veil-note">40 seconds · sound on</p>
        </div>
      </div>
      <div class="rec-dot" id="recdot" hidden>REC</div>
    </div></div>

    <footer class="bar">
      <div class="group">
        <button id="play" type="button" title="Play / Pause (Space)">Play</button>
        <button id="restart" type="button" title="Restart (R)">Restart</button>
        <button id="mute" type="button" title="Mute / Unmute (M)" aria-pressed="false">Mute</button>
      </div>
      <input id="seek" type="range" min="0" max="40" step="0.01" value="0" aria-label="Seek" />
      <div class="group">
        <span class="time" id="time">00:00.0 / 00:40.0</span>
        <button id="record" type="button" title="Record the film to a video file">Record</button>
        <button id="wav" type="button" title="Export the soundtrack as WAV">WAV</button>
        <button id="full" type="button" title="Fullscreen (F)">Full</button>
      </div>
    </footer>
    <p class="hint" id="hint"></p>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
